<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard </title>
    <link rel="stylesheet" href="/styles/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="flex">

        <aside class="aside w-64 text-white h-screen p-5">
            <a href="#"><img src="/images/logoBank.png" alt="logoBank"></a>

            <ul class="space-y-3 mt-6">

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition">
                        <img src="/images/accueil.png" alt="iconAccueil" class="w-5 h-5">
                        <span>Accueil</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition">
                        <img src="/images/virement.png" alt="iconVirement" class="w-5 h-5">
                        <span>Virement</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition">
                        <img src="/images/payment.png" alt="iconPayment" class="w-5 h-5">
                        <span>Payments</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition">
                        <img src="/images/convert.png" alt="iconConvert" class="w-5 h-5">
                        <span>Currency Converter</span>
                    </a>
                </li>

            </ul>
        </aside>
    </div>
</body>

</html>
