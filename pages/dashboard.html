<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard </title>
    <link rel="stylesheet" href="/styles/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <div class="flex">

        <aside class="aside w-64 text-white h-screen p-5">
            <a href="#"><img src="/images/logoBank.png" alt="logoBank"></a>

            <ul class="space-y-6 mt-6 border-t border-gray-700">

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:text-white transition">
                        <img src="/images/accueil.png" alt="iconAccueil" class="w-5 h-5">
                        <span>Accueil</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:text-white transition">
                        <img src="/images/virement.png" alt="iconVirement" class="w-5 h-5">
                        <span>Virement</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:text-white transition">
                        <img src="/images/payment.png" alt="iconPayment" class="w-5 h-5">
                        <span>Payments</span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="flex items-center gap-3 p-2 rounded-lg text-gray-300 hover:text-white transition">
                        <img src="/images/convert.png" alt="iconConvert" class="w-5 h-5">
                        <span>Currency Converter</span>
                    </a>
                </li>

            </ul>
            <div class="mt-6 border-t border-gray-700 pt-4">
                <div class="flex items-center gap-3">
                    <img src="/images/imagePersonnale.jpg" alt="User"
                        class="w-10 h-10 rounded-full border-2 border-blue-500">
                    <div>
                        <div class="relative" id="userMenu">
                            <button id="userBtn"
                                class="w-full text-center text-lg font-semibold text-gray-800 mb-2 transition flex items-center justify-center gap-2">
                                Lahmar Zakariae
                                <i class="fas fa-chevron-down text-sm"></i>
                            </button>

                            <div id="dropdownMenu"
                                class="hidden bg-white shadow-md rounded-xl p-3 space-y-2 absolute w-48 right-0 mt-2">

                                <button
                                    class="flex items-center w-full px-3 py-2 rounded-xl hover:bg-gray-100 transition">
                                    <i class="fas fa-user-circle text-red-500 text-lg mr-3"></i>
                                    <span class="text-gray-700">Profil</span>
                                </button>

                                <button
                                    class="flex items-center w-full px-3 py-2 rounded-xl hover:bg-gray-100 transition">
                                    <i class="fas fa-cog text-gray-600 text-lg mr-3"></i>
                                    <span class="text-gray-700">Paramètres</span>
                                </button>

                                <button
                                    class="flex items-center w-full px-3 py-2 rounded-xl hover:bg-gray-100 transition">
                                    <i class="fas fa-sign-out-alt text-gray-600 text-lg mr-3"></i>
                                    <span class="text-gray-700">Déconnexion</span>
                                </button>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    <script src="/js/dashboard.js"></script>
</body>

</html>
